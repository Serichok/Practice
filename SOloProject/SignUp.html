<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Serik">
    <meta name="content" content="csgo,cs1.6,game,shooter">
    <title>Log in</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="shortcut icon" href="icons8-counter-strike-50.png" type="image/x-icon">
</head>
<body>
    <header>
        <img src="https://cdn.akamai.steamstatic.com/apps/csgo/images/csgo_react/global/logo_cs_sm.svg" alt="Лого cs" title="Logo og csgo"/>
    </header>
    <div class="container">
        <form>
            <h1>Signup Form</h1>
            <div class="form-group">
                <label for="">Email</label>
                <input type="text" class="form-control" required placeholder="Email">
            </div>
            <div class="form-group">
                <label for="">Password</label>
                <input type="password" class="form-control" required placeholder="Password" maxlength="8">
            </div>
            <div class="form-group">
                <label for="">Confirm Email</label>
                <input type="password" class="form-control" required placeholder="Confirm Password" maxlength="8">
            </div>
            <div class="account">
                <a href="LogIn.html">Already have an account</a>
            </div>
            <input type="submit" class="btn" value="Sign up" onclick="MainPage()">
        </form>
    </div>
    <footer>
        <p class="description">Counter-Strike, Counter-Strike 2, CS:GO and related logos are trademarks and/or registered trademarks of Valve Corporation. © 2023 Valve Corporation, all rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
